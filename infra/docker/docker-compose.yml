# Entorno local completo de MorphiqPOS: Postgres + almacenamiento de archivos.
#
# Esto NO es sólo para desarrollar. Es el requisito A-27: el mismo compose es lo
# que se instala en la PC de un cliente que no quiere depender de internet.
# Por eso aquí no hay nada propietario y nada que necesite una cuenta.
#
#   pnpm db:up       levanta                 pnpm db:down    apaga
#   pnpm db:reset    borra datos y relevanta  pnpm db:logs   registros
#
# Puertos publicados en la máquina anfitriona:
#   5433  Postgres          (5432 se deja libre por si hay otro Postgres instalado)
#   9000  Almacenamiento    API S3
#   9001  Almacenamiento    consola web
#
# Las imágenes van fijadas a una versión exacta, nunca a "latest":
# gate morphiq-prs §20, build reproducible.

name: morphiqpos

services:
  postgres:
    image: postgres:17.11-alpine
    container_name: morphiqpos-postgres
    restart: unless-stopped
    environment:
      # Credenciales de desarrollo local. NO son un secreto: esta base sólo
      # escucha en localhost y se destruye con `pnpm db:reset`. Una instalación
      # en casa de un cliente define las suyas en su propio .env (R31).
      POSTGRES_USER: ${POSTGRES_USER:-morphiqpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphiqpos_local}
      POSTGRES_DB: ${POSTGRES_DB:-morphiqpos}
      # Español mexicano y UTF-8 desde el inicio: el ordenamiento de nombres con
      # acentos y ñ tiene que ser correcto en los reportes desde el primer día.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-morphiqpos} -d ${POSTGRES_DB:-morphiqpos}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      # Postgres 16 por omisión trae valores muy conservadores. Estos son para
      # una PC de escritorio, que es donde va a correr (A-16, A-27).
      - postgres
      - '-c'
      - 'max_connections=100'
      - '-c'
      - 'shared_buffers=256MB'
      # Registrar toda sentencia que tarde más de 200 ms. Es lo que permite
      # detectar N+1 y consultas sin índice antes de que un cliente las sufra.
      - '-c'
      - 'log_min_duration_statement=200'

  almacenamiento:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: morphiqpos-almacenamiento
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-morphiqpos}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-morphiqpos_local}
    ports:
      - '${STORAGE_PORT:-9000}:9000'
      - '${STORAGE_CONSOLE_PORT:-9001}:9001'
    volumes:
      - almacenamiento-datos:/datos
    command: server /datos --console-address ':9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  almacenamiento-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: morphiqpos-almacenamiento-init
    depends_on:
      almacenamiento:
        condition: service_healthy
    # Crea el bucket y lo deja PRIVADO. Los archivos se sirven con URL firmada,
    # nunca por acceso anónimo (SEC-RLS de 06-DEFECTOS §4).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://almacenamiento:9000 '${STORAGE_ACCESS_KEY:-morphiqpos}' '${STORAGE_SECRET_KEY:-morphiqpos_local}' &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-morphiqpos} &&
      mc anonymous set none local/${STORAGE_BUCKET:-morphiqpos} &&
      echo 'bucket ${STORAGE_BUCKET:-morphiqpos} listo y privado'
      "
    restart: 'no'

volumes:
  postgres-datos:
    name: morphiqpos-postgres-datos
  almacenamiento-datos:
    name: morphiqpos-almacenamiento-datos
