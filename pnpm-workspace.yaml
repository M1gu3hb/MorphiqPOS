# Workspaces del monorepo. Ver docs/fase-1/04-ARQUITECTURA-Y-MONOREPO.md §1
# del repositorio de documentacion (M1gu3hb/MorphiqPOS).
#
# historico/ NO es un workspace a proposito: es evidencia, no codigo.
# No se compila, no se lintea, no se importa.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'capabilities/*'

# Catalogo de versiones. Un paquete escribe "catalog:" y hereda de aqui.
# Con 15 paquetes por venir, es lo que impide que dos usen versiones distintas
# de la misma herramienta y que las pruebas se comporten distinto segun donde
# se corran.
catalog:
  typescript: 6.0.3
  vitest: 5.0.0
  '@vitest/coverage-v8': 5.0.0
  '@types/node': 24.13.3
