# Workspaces del monorepo. Ver docs/fase-1/04-ARQUITECTURA-Y-MONOREPO.md §1
# del repositorio de documentacion (M1gu3hb/MorphiqPOS).
#
# historico/ NO es un workspace a proposito: es evidencia, no codigo.
# No se compila, no se lintea, no se importa.
packages:
  - 'apps/*'
  - 'packages/*'
  - 'capabilities/*'

# Catalogo de versiones. Un paquete escribe "catalog:" y hereda de aqui.
# Con 15 paquetes por venir, es lo que impide que dos usen versiones distintas
# de la misma herramienta y que las pruebas se comporten distinto segun donde
# se corran.
catalog:
  typescript: 6.0.3
  vitest: 5.0.0
  '@vitest/coverage-v8': 5.0.0
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  next: 16.3.4
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  next-themes: 0.4.6
  '@tanstack/react-query': 5.102.8
  sonner: 2.0.8
  lucide-react: 1.42.0
  'class-variance-authority': 0.7.1
  clsx: 2.1.1
  'tailwind-merge': 3.6.0
  eslint: 10.10.0
  'typescript-eslint': 8.70.0
  'eslint-config-prettier': 10.1.8
  'eslint-plugin-react-hooks': 7.1.1
  '@next/eslint-plugin-next': 16.3.4
  globals: 17.12.0
  prettier: 3.9.6
  '@playwright/test': 1.63.0
  zod: 4.5.4

minimumReleaseAgeExclude:
  - lucide-react@1.42.0
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
